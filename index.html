<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blocked Site</title>

<link rel="icon" type="image/png" href="icon.png">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#ffffff;
    color:#323130;
    font-family:
        "Segoe UI",
        SegoeUI,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
}

.page{
    max-width:760px;
    margin:0 auto;
    padding:72px 32px 48px;
}

.brand{
    color:#0078d4;
    font-size:14px;
    font-weight:600;
    margin-bottom:40px;
}

.icon{
    width:52px;
    height:52px;
    margin-bottom:28px;
}

.icon img{
    width:100%;
    height:100%;
    object-fit:contain;
}

h1{
    margin:0 0 18px;
    font-size:36px;
    font-weight:600;
    line-height:1.2;
    letter-spacing:-0.5px;
}

.message{
    margin:0 0 30px;
    color:#605e5c;
    font-size:16px;
    line-height:1.6;
    max-width:620px;
}

.label{
    margin-bottom:8px;
    color:#605e5c;
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.5px;
}

.site{
    margin-bottom:36px;
    color:#323130;
    font-size:18px;
    line-height:1.5;
    word-break:break-word;
}

.button-row{
    display:flex;
    gap:12px;
}

button{
    border:none;
    border-radius:4px;
    padding:10px 22px;
    background:#0078d4;
    color:white;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#106ebe;
}

.footer{
    margin-top:90px;
    color:#8a8886;
    font-size:12px;
}

.error-code{
    margin-top:6px;
    color:#a19f9d;
    font-size:12px;
}

@media (max-width:600px){

    .page{
        padding:40px 24px;
    }

    h1{
        font-size:30px;
    }

    button{
        width:100%;
    }

    .button-row{
        display:block;
    }

}

</style>
</head>

<body>

<div class="page">

    <div class="brand">
        SecurTrack
    </div>

    <div class="icon">
        <img src="warn.png" alt="Warning Icon">
    </div>

    <h1>This website has been blocked</h1>

    <p class="message">
    Your network's web filtering policy is preventing you from accessing this site. Please speak to your administrator for assistance.
    </p>

    <div class="label">
        Website
    </div>

    <div class="site" id="website">
        Unknown website
    </div>

    <div class="button-row">
        <button onclick="goBack()">
            Go back
        </button>
    </div>

    <div class="footer">
        Protected by SecurTrack

        <div class="error-code">
            Error code: ST1001
        </div>
    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const site =
    params.get("site") ||
    params.get("url") ||
    "Unknown website";

document.getElementById("website").textContent = site;

function goBack() {
    if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = "about:blank";
    }
}

</script>

</body>
</html>
