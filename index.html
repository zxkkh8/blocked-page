<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>This website has been blocked</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#ffffff;
    color:#323130;
    font-family:
        "Segoe UI",
        SegoeUI,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
}

.page{
    max-width:760px;
    margin:0 auto;
    padding:72px 32px 48px;
}

.brand{
    color:#0078d4;
    font-size:14px;
    font-weight:600;
    margin-bottom:40px;
}

.icon{
    width:52px;
    height:52px;
    margin-bottom:28px;
}

.icon svg{
    width:100%;
    height:100%;
}

h1{
    margin:0 0 18px;
    font-size:36px;
    font-weight:600;
    line-height:1.2;
    letter-spacing:-0.5px;
}

.message{
    margin:0 0 30px;
    color:#605e5c;
    font-size:16px;
    line-height:1.6;
    max-width:620px;
}

.label{
    margin-bottom:8px;
    color:#605e5c;
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.5px;
}

.site{
    margin-bottom:36px;
    color:#323130;
    font-size:18px;
    line-height:1.5;
    word-break:break-word;
}

.button-row{
    display:flex;
    gap:12px;
}

button{
    border:none;
    border-radius:4px;
    padding:10px 22px;
    background:#0078d4;
    color:white;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

button:hover{
    background:#106ebe;
}

.footer{
    margin-top:90px;
    color:#8a8886;
    font-size:12px;
}

.error-code{
    margin-top:6px;
    color:#a19f9d;
    font-size:12px;
}

@media (max-width:600px){

    .page{
        padding:40px 24px;
    }

    h1{
        font-size:30px;
    }

    button{
        width:100%;
    }

    .button-row{
        display:block;
    }

}

</style>
</head>

<body>

<div class="page">

    <div class="brand">
        SecurTrack
    </div>

    <div class="icon">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path
                d="M24 4L2.8 42H45.2L24 4Z"
                fill="#ffb900"
            />
            <rect
                x="22"
                y="17"
                width="4"
                height="14"
                rx="2"
                fill="#323130"
            />
            <circle
                cx="24"
                cy="36"
                r="2"
                fill="#323130"
            />
        </svg>
    </div>

    <h1>This website has been blocked</h1>

    <p class="message">
        Your organisation's web filtering policy has prevented
        access to this website.
    </p>

    <div class="label">
        Website
    </div>

    <div class="site" id="website">
        Unknown website
    </div>

    <div class="button-row">
        <button onclick="goBack()">
            Go back
        </button>
    </div>

    <div class="footer">
        Protected by SecurTrack

        <div class="error-code">
            Error code: ST1001
        </div>
    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const site =
    params.get("site") ||
    params.get("url") ||
    "Unknown website";

document.getElementById("website").textContent = site;

function goBack() {

    if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = "about:blank";
    }

}

</script>

</body>
</html>
